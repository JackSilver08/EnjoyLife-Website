name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    name: Next.js lint, typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Offline VietQR codec and UI contract regression
        run: node scripts/test-payos-qr.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          API_INTERNAL_URL: http://localhost:8081
          NEXT_PUBLIC_SITE_URL: https://enjoylife.example.com
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
      - name: Published Journal SSR, SEO and security regression
        env:
          NEXT_PUBLIC_SITE_URL: https://enjoylife.example.com
        run: |
          node scripts/mock-journal-api.mjs > /tmp/enjoy-mock-api.log 2>&1 &
          API_PID=$!
          npm run start -- -p 3399 > /tmp/enjoy-next.log 2>&1 &
          WEB_PID=$!
          trap 'kill $WEB_PID $API_PID 2>/dev/null || true' EXIT
          node scripts/check-origin.mjs
      - name: Show Next.js and mock API logs on failure
        if: failure()
        run: |
          cat /tmp/enjoy-next.log 2>/dev/null || true
          cat /tmp/enjoy-mock-api.log 2>/dev/null || true
  backend:
    name: Go tests and vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: go test ./...
      - run: go vet ./...
      - name: Compose dev admin config regression
        working-directory: .
        run: |
          cp .env.example .env
          python3 - <<'PY'
          import json, subprocess
          obj=json.loads(subprocess.check_output(["docker","compose","config","--format","json"],text=True))
          env=obj["services"]["api"]["environment"]
          expected={"APP_ENV":"development","GIN_MODE":"debug","ENABLE_DEV_ADMIN":"true"}
          for key,value in expected.items():
              assert env.get(key)==value, (key,env.get(key))
          print("Compose API auth config:",{key:env[key] for key in expected})
          PY
      - name: PostgreSQL integration test
        run: |
          docker run -d --name enjoy-ci-postgres -e POSTGRES_USER=enjoylife -e POSTGRES_PASSWORD=ci_password -e POSTGRES_DB=enjoylife -p 55433:5432 postgres:17-alpine
          for i in {1..30}; do docker exec enjoy-ci-postgres pg_isready -U enjoylife -d enjoylife && break; sleep 2; done
          for file in db/init/001_schema.sql db/init/002_seed.sql db/init/003_vietnamese_catalog.sql db/init/004_accounts.sql db/init/005_admin_audit.sql; do
            docker exec -i enjoy-ci-postgres psql -v ON_ERROR_STOP=1 -U enjoylife -d enjoylife < "$file"
          done
          INTEGRATION_DATABASE_URL="postgres://enjoylife:ci_password@localhost:55433/enjoylife?sslmode=disable" go test ./internal/handlers -run 'Test(AdminIntegration|BlogIntegration|PayOSIntegration|Sprint9WarehouseIntegration)' -count=1 -v

  docker_dev_dependencies:
    name: Docker dev dependency volume regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure local Compose development
        run: cp .env.example .env
      - name: Check dependency startup shell syntax
        run: sh -n apps/web/scripts/ensure-deps.sh
      - name: Simulate Windows CRLF checkout for mounted shell script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("apps/web/scripts/ensure-deps.sh")
          source = p.read_bytes().replace(b"\r\n", b"\n").replace(b"\n", b"\r\n")
          p.write_bytes(source)
          assert b"\r\nset -eu\r\n" in source
          print("Created Windows CRLF test fixture for bind-mounted script")
          PY
      - name: Validate JavaScript integration tests before Docker boot
        run: |
          node --check apps/web/scripts/journal-docker-e2e.mjs
          node --check apps/web/scripts/staff-docker-e2e.mjs
          node --check apps/web/scripts/orders-payment-docker-e2e.mjs
          node --check apps/web/scripts/chatbot-docker-e2e.mjs
          node --check apps/web/scripts/test-payos-qr.mjs
          node --check apps/web/scripts/check-origin.mjs
      - name: Build web development image
        run: docker compose build web
      - name: Simulate a stale node_modules named volume
        run: |
          docker compose run --rm --no-deps --entrypoint sh web -ec '
            rm -rf node_modules/@tiptap/extension-image node_modules/.enjoy-package-sha256
            test ! -e node_modules/@tiptap/extension-image
          '
      - name: Restore dependency from manifest using actual Compose volume
        run: |
          docker compose run --rm --no-deps --entrypoint sh web -ec '
            tr -d "\015" < scripts/ensure-deps.sh | sh
            node -e "require.resolve(\"@tiptap/extension-image\"); require.resolve(\"@tiptap/react\")"
            test -s node_modules/.enjoy-package-sha256
          '
      - name: Verify repeat start preserves installed dependencies
        run: |
          docker compose run --rm --no-deps --entrypoint sh web -ec '
            tr -d "\015" < scripts/ensure-deps.sh | sh
            node -e "require.resolve(\"@tiptap/extension-image\")"
          '
      - name: Boot full development Compose stack and wait for health
        run: |
          docker compose up -d --build --wait --wait-timeout 300
          docker compose ps
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3000/api/health | grep '"status":"ok"'
          docker compose exec -T web node -p 'require.resolve("@tiptap/extension-image")'
      - name: Verify local payOS healthcheck script without secrets
        run: |
          pwsh -NoProfile -NonInteractive -File scripts/configure-payos.ps1 -CheckOnly
      - name: Published Journal end-to-end via real Go and PostgreSQL
        run: node apps/web/scripts/journal-docker-e2e.mjs
      - name: Sprint 7 staff RBAC end-to-end via Next proxy and real PostgreSQL
        run: node apps/web/scripts/staff-docker-e2e.mjs
      - name: Sprint 8.1 order status and payment readiness E2E via browser proxy
        run: node apps/web/scripts/orders-payment-docker-e2e.mjs
      - name: Shopper AI diagnostics and browser proxy E2E
        run: |
          pwsh -NoProfile -NonInteractive -File scripts/check-openai.ps1 -CheckOnly
          node apps/web/scripts/chatbot-docker-e2e.mjs
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail=180 web api db

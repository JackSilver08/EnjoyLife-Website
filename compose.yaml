name: enjoy-life
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-enjoylife}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:-enjoylife}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-enjoylife}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-enjoylife}?sslmode=disable
      PORT: "8081"
      # Persist Go compilation artifacts between recreated development containers.
      # go run compiles at startup, which is slower on Windows bind mounts.
      GOCACHE: /go/build-cache
      # Local demo auth flags are read from env_file (.env) directly.
      # Do not override them with Compose interpolation defaults.
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      # Cold Go compilation and additive DB migrations need a startup grace period.
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/go/build-cache
      - media_data:/app/media
    working_dir: /app
    command: ["go", "run", "./cmd/server"]
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8081
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      NEXT_TELEMETRY_DISABLED: "1"
      ADMIN_PREVIEW_USER: ${ADMIN_PREVIEW_USER:-}
      ADMIN_PREVIEW_PASSWORD: ${ADMIN_PREVIEW_PASSWORD:-}
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    # Always verify dependencies inside the named volume; --build alone does not refresh it.
    # CRLF-safe on Windows bind mounts: strip carriage returns before /bin/sh reads the script.
    # Next.js 16 defaults to Turbopack. Webpack with Watchpack polling is a safer
    # local fallback for Windows Docker Desktop bind mounts prone to noisy HMR.
    command: ["sh", "-ec", "tr -d '\\015' < scripts/ensure-deps.sh | sh && exec npm run dev -- --webpack --hostname 0.0.0.0"]
    healthcheck:
      # Do not compile the full SSR homepage just to check Next.js readiness.
      # The first local start may install npm packages into an older named volume.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/api/health', r => {r.resume();process.exit(r.statusCode===200?0:1)}).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 90s
volumes:
  postgres_data:
  go_mod_cache:
  go_build_cache:
  web_node_modules:
  web_next_cache:
  media_data:

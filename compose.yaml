name: enjoy-life
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-enjoylife}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:-enjoylife}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-enjoylife}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-enjoylife}?sslmode=disable
      PORT: "8081"
      GIN_MODE: ${GIN_MODE:-release}
      APP_ENV: ${APP_ENV:-production}
      ENABLE_DEV_ADMIN: ${ENABLE_DEV_ADMIN:-false}
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - go_mod_cache:/go/pkg/mod
    working_dir: /app
    command: ["go", "run", "./cmd/server"]
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8081
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
      ADMIN_PREVIEW_USER: ${ADMIN_PREVIEW_USER:-}
      ADMIN_PREVIEW_PASSWORD: ${ADMIN_PREVIEW_PASSWORD:-}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
volumes:
  postgres_data:
  go_mod_cache:
  web_node_modules:
  web_next_cache:
